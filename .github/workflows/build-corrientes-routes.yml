name: Build Corrientes route layer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download official political and route datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw output
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://apis.datos.gob.ar/georef/api/v2.0/departamentos.geojson' \
            --output raw/departamentos.geojson
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://ide.transporte.gob.ar/geoserver/idera/ows?maxFeatures=10000&outputFormat=application%2Fjson&request=GetFeature&service=WFS&typeName=idera%3ARutas_Nacionales&version=1.0.0' \
            --output raw/rutas-nacionales.geojson
          curl --insecure --fail --location --retry 5 --retry-delay 2 \
            'https://wms.ign.gob.ar/geoserver/transporte/ows?maxFeatures=100000&outputFormat=application%2Fjson&request=GetFeature&service=WFS&typeName=transporte%3Avial_provincial&version=1.0.0' \
            --output raw/rutas-provinciales.geojson
      - name: Install geometry tools
        run: python -m pip install --disable-pip-version-check shapely
      - name: Clip national and provincial routes to Corrientes
        shell: python
        run: |
          import json
          import re
          import unicodedata
          from pathlib import Path
          from shapely.geometry import shape, mapping
          from shapely.ops import unary_union

          def norm(value):
              value = unicodedata.normalize('NFD', str(value or ''))
              return ''.join(ch for ch in value if unicodedata.category(ch) != 'Mn').lower()

          departments = json.loads(Path('raw/departamentos.geojson').read_text(encoding='utf-8'))
          corrientes = []
          for feature in departments.get('features', []):
              props = feature.get('properties') or {}
              province = props.get('provincia') or {}
              province_id = str(province.get('id') if isinstance(province, dict) else props.get('provincia_id') or '')
              province_name = province.get('nombre') if isinstance(province, dict) else props.get('provincia_nombre')
              if province_id.zfill(2) == '18' or norm(province_name) == 'corrientes':
                  corrientes.append(shape(feature['geometry']))
          if len(corrientes) < 25:
              raise SystemExit(f'Expected 25 Corrientes departments, got {len(corrientes)}')
          province = unary_union(corrientes).buffer(0)

          def first_value(props, names):
              for name in names:
                  value = props.get(name)
                  if value not in (None, '', 0):
                      return str(value).strip()
              return ''

          def normalize_ref(props, route_class):
              raw = first_value(props, ['ref','ruta','rtn','numero','nro_ruta','nro','num_ruta','codigo','cod_ruta','nombre','name','nom_ruta','designacion'])
              digits = re.search(r'\d+[A-Za-z]?', raw)
              if digits:
                  return ('RN ' if route_class == 'national' else 'RP ') + digits.group(0).upper()
              prefix = 'RN' if route_class == 'national' else 'RP'
              return f'{prefix} {raw}'.strip() if raw else prefix

          outputs = []
          specs = [
              ('raw/rutas-nacionales.geojson', 'national', 'output/rutas-nacionales-corrientes.geojson'),
              ('raw/rutas-provinciales.geojson', 'provincial', 'output/rutas-provinciales-corrientes.geojson'),
          ]
          for source_path, route_class, target_path in specs:
              payload = json.loads(Path(source_path).read_text(encoding='utf-8'))
              source_features = payload.get('features') or []
              print(route_class, 'source count', len(source_features))
              if source_features:
                  print(route_class, 'property keys', sorted((source_features[0].get('properties') or {}).keys()))
              clipped = []
              for feature in source_features:
                  geometry_payload = feature.get('geometry')
                  if not geometry_payload:
                      continue
                  geom = shape(geometry_payload)
                  if geom.is_empty or not geom.intersects(province):
                      continue
                  intersection = geom.intersection(province)
                  if intersection.is_empty:
                      continue
                  if intersection.geom_type not in {'LineString','MultiLineString'}:
                      line_parts = [part for part in getattr(intersection, 'geoms', []) if part.geom_type in {'LineString','MultiLineString'}]
                      if not line_parts:
                          continue
                      intersection = unary_union(line_parts)
                  props = dict(feature.get('properties') or {})
                  props['routeClass'] = route_class
                  props['routeRef'] = normalize_ref(props, route_class)
                  clipped.append({'type':'Feature','properties':props,'geometry':mapping(intersection)})
              if not clipped:
                  raise SystemExit(f'No {route_class} routes clipped to Corrientes')
              output = {
                  'type':'FeatureCollection',
                  'name':Path(target_path).stem,
                  'source':'Dirección Nacional de Vialidad / Instituto Geográfico Nacional',
                  'features':clipped,
              }
              Path(target_path).write_text(json.dumps(output, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              print(target_path, len(clipped), Path(target_path).stat().st_size)
              outputs.append((route_class, len(clipped)))
          Path('output/README.txt').write_text(
              'Rutas nacionales: Dirección Nacional de Vialidad, datos.transporte.gob.ar.\n'
              'Rutas provinciales: Instituto Geográfico Nacional, datos.transporte.gob.ar.\n'
              'Geometrías recortadas al límite político de Corrientes.\n' +
              '\n'.join(f'{kind}: {count} tramos' for kind, count in outputs),
              encoding='utf-8'
          )
      - uses: actions/upload-artifact@v4
        with:
          name: corrientes-routes-only
          path: output/*
          if-no-files-found: error
          retention-days: 1
